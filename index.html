<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise d'Anniversaire</title>
    <style>
    /* Styles de base - pour centrer le tout */
    body {
        margin: 0;
        padding: 0;
        background-color: #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    /* Conteneur de l'enveloppe */
    .envelope-container {
        position: relative;
        width: 300px;
        height: 200px;
        cursor: pointer;
    }

    /* Rabat supérieur de l'enveloppe */
    .flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        border-left: 150px solid transparent;
        border-right: 150px solid transparent;
        border-top: 100px solid #e2610b; /* Orange plus clair */
        z-index: 3;
        transform-origin: top;
        transition: transform 0.6s ease;
    }

    /* Face avant de l'enveloppe (le bas orange) */
    .envelope-face {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #d35400; /* Orange plus foncé */
        z-index: 2;
    }

    /* --- LA LETTRE GEANTE (la carte blanche) --- */
    .letter-card {
        position: absolute;
        top: 10px;
        left: 10px;
        /* --- CHANGEMENT MAJEUR ICI --- */
        width: 800px; /* Plus de 3 fois plus large ! */
        height: 600px; /* Plus de 3 fois plus haute ! */
        background-color: #fff;
        z-index: 1;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        transition: transform 0.8s ease; /* Légèrement plus lent pour l'effet */
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 30px; /* Plus d'espace */
        box-sizing: border-box;
    }

    /* Conteneur de la photo */
    .photo-container {
        width: 100%;
        /* --- CHANGEMENT MAJEUR ICI --- */
        height: 450px; /* Une hauteur énorme pour la photo */
        margin-bottom: 25px; /* Espace avant le texte */
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* La photo elle-même */
    .photo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Fait tenir TOUTE l'image sans la couper */
        object-position: center; /* Centre l'image */
    }

    /* Le texte de la carte */
    .letter-card p {
        margin: 0;
        text-align: center;
        /* --- CHANGEMENT ICI --- */
        font-size: 2rem; /* Texte beaucoup plus grand */
        color: #333;
        font-weight: bold;
    }

    /* --- Animations --- */

    /* Quand l'enveloppe est ouverte */
    .envelope-container.open .flap {
        transform: rotateX(180deg);
        z-index: 1; /* Le rabat passe derrière la lettre */
    }

    /* --- CHANGEMENT MAJEUR ICI POUR QUE LA LETTRE SORTE --- */
    .envelope-container.open .letter-card {
        /* On doit la faire sortir beaucoup plus loin à cause de sa taille */
        transform: translateY(-620px); 
    }
</style>
</head>
<body>

    <div class="container">
        <div class="instruction" id="click-text">SRB ?? Clique sur le bet ! </div>
        
        <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
            <div class="envelope"></div>
            
            <div class="letter">
                <!-- 1. INSÈRE LE LIEN DE TA PHOTO ICI -->
                <img src="photo.jpg" alt="Photo souvenir">
                
                <!-- 2. INSÈRE TON TEXTE ICI -->
                <p>Joyeux Anniversaire Bosssssssssss🎉</p>
            </div>
            
            <div class="flap"></div>
            <div class="pocket"></div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            // Ajoute la classe "open" pour lancer l'animation
            document.getElementById('envelope').classList.add('open');
            
            // Fait disparaître le petit texte d'indication en douceur
            document.getElementById('click-text').style.opacity = '0';
        }
    </script>

</body>
</html>
